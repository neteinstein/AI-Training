name: CI

on:
  push:
    branches: [main]
  pull_request:
  # One job on its own, on any branch: Actions → CI → Run workflow. Checking a database
  # change this way takes a couple of minutes instead of the whole run.
  workflow_dispatch:
    inputs:
      job:
        description: Which job to run
        type: choice
        default: all
        options:
          - all
          - quality
          - database
          - e2e

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ inputs.job || 'all' }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Lint, types and unit tests
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.job == 'all' || inputs.job == 'quality' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test

  database:
    name: Database rules
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.job == 'all' || inputs.job == 'database' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Only the services the tests need: database, auth, API gateway, storage and mail catcher.
      - run: npx supabase start -x realtime,imgproxy,studio,postgres-meta,edge-runtime,logflare,vector,supavisor
      - run: npm run env:local
      - run: npm run test:integration
      # The committed type definitions must be the ones this database produces. When they are
      # not, the right file is kept with the run (artifact `database-types`).
      - name: Check the database types are up to date
        if: ${{ !cancelled() }}
        run: |
          npm run db:types
          git diff --exit-code -- src/lib/supabase/database.types.ts
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: database-types
          path: src/lib/supabase/database.types.ts
          retention-days: 7
          if-no-files-found: ignore

  e2e:
    name: End-to-end
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.job == 'all' || inputs.job == 'e2e' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx supabase start -x realtime,imgproxy,studio,postgres-meta,edge-runtime,logflare,vector,supavisor
      - run: npm run env:local
      # The tests run against the production build.
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # SCREENS=1 also saves pictures of the main screens and of an email (e2e/screens.spec.ts).
      - run: npm run e2e
        env:
          SCREENS: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
      # Kept for a week with every run, so the look of a change can be reviewed from here.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: e2e-screens
          retention-days: 7
          if-no-files-found: ignore
