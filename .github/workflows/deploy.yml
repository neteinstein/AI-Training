name: Deploy

# Builds the app for Cloudflare Workers (OpenNext) and deploys it to
# https://training.pedrovicente.pt. Runs on every push to main, or by hand.
#
# Needs one repository secret (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN  a token with "Edit Cloudflare Workers" permissions, plus Zone > DNS > Edit
#                         and Zone > Workers Routes > Edit on pedrovicente.pt, and D1 > Edit.
# SUPABASE_SECRET_KEY is not needed here: it is a Worker secret, set once with
# `npx wrangler secret put SUPABASE_SECRET_KEY`, and kept across deploys.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # Inlined into the browser bundle at build time; the same values are in wrangler.jsonc "vars".
  NEXT_PUBLIC_SUPABASE_URL: https://wsyxnxtinvhnecmwkhzt.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_pszwONINzSRgWXkXdOUMFA_MvFvS4kU
  NEXT_PUBLIC_SITE_URL: https://training.pedrovicente.pt

jobs:
  deploy:
    name: Build and deploy to Cloudflare
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://training.pedrovicente.pt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run cf:build
      - run: npx opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 50a0da54f66ae402bb3de1d139559828
